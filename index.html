<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Animal Rescuers — Adopt a Puppy</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&family=Amatic+SC:wght@400;700&family=Inter:wght@400;600;700;800&family=Playpen+Sans:wght@400;700;800&subset=greek&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Playpen Sans';
      src: url('assets/PlaypenSans-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }
    :root {
      --font-body:    'Poppins';
      --font-heading: 'Amatic SC';
    }
    body[data-lang="el"] {
      --font-body:    'Inter';
      --font-heading: 'Playpen Sans';
    }
    body[data-lang="el"] h1,
    body[data-lang="el"] h2,
    body[data-lang="el"] h3 { font-weight: 400 !important; }
    h1, h2, h3 { font-family: var(--font-heading), cursive !important; letter-spacing: 0.02em; }
    h1 { font-weight: 700 !important; }
    h2 { font-weight: 700 !important; font-size: clamp(42px, 6vw, 72px) !important; }
    h3 { font-weight: 700 !important; font-size: clamp(28px, 4vw, 40px) !important; }
    body[data-lang="el"] h2 { font-size: clamp(34px, 4.8vw, 56px) !important; }
    body[data-lang="el"] h3 { font-size: clamp(22px, 3vw, 30px) !important; }
    body[data-lang="el"] h3.step-title { font-size: clamp(18px, 1.9vw, 22px) !important; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body), sans-serif; background: #6C2C25; padding-bottom: clamp(56px, 7vw, 86px); }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #6C2C25; }
    ::-webkit-scrollbar-thumb { background: #EB5E3A; border-radius: 3px; }
    * { -webkit-font-smoothing: antialiased; }
    .hero-lang { display: none; }
    @media (max-width: 640px) {
      .hero-lang { display: flex; justify-content: center; margin-bottom: 20px; }
      .nav-lang.home { display: none; }
      .hero-section { min-height: auto !important; padding: 122px 20px 36px !important; border: 0 !important; }
      .hero-section { position: relative; z-index: 0; }
      .story-section { padding-top: 24px !important; border: 0 !important; box-shadow: none !important; margin-top: -2px !important; position: relative; z-index: 1; }
      .story-img { width: 100% !important; aspect-ratio: 4 / 5 !important; }
      .about-img { width: 100% !important; }
      .about-section { padding-top: 48px !important; }
      .site-footer { padding: 20px !important; }
      .footer-logo { height: 40px !important; display: block; margin: 0 auto 6px !important; border-radius: 6px !important; }
      .footer-copy { margin: 0 !important; color: rgba(248,245,232,0.3) !important; }
      .nav-adopt { transition: opacity 0.3s, transform 0.3s !important; }
      .nav-adopt.at-top { opacity: 0; transform: translateY(-8px) !important; pointer-events: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="app.js"></script>

  <!-- ANALYTICS: replace GOATCOUNTER_CODE below with the site code from goatcounter.com (the part before .goatcounter.com). It appears only here. -->
  <script data-goatcounter="https://GOATCOUNTER_CODE.goatcounter.com/count"
          data-goatcounter-settings='{"no_onload":true}'
          onload="window.__gcReady && window.__gcReady()"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
